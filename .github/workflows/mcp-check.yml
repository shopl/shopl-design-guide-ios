# SDG_BUILDER_MCP_PR: ios-pr-metadata-v1
name: SDG MCP Check
run-name: ${{ github.event_name == 'workflow_dispatch' && format('SDG MCP PR · {0} · {1}', inputs.source_sha, inputs.request_id) || github.event.head_commit.message || github.event.pull_request.title }}

# SDG 소스가 바뀌면 플러그인의 생성 데이터·번들도 같은 PR에서 갱신되어야 한다.
# 여기서 다시 생성한 결과가 커밋된 파일과 다르면 실패시켜, 오래된 메타데이터가 배포되는 것을 막는다.

on:
  # 플러그인의 iOS PR 버튼에서만 호출한다. CI는 생성 결과를 반환하고 직접 push하지 않는다.
  workflow_dispatch:
    inputs:
      source_sha: {required: true, type: string}
      source_branch: {required: true, type: string}
      source_base: {required: true, type: string}
      request_id: {required: true, type: string}
  pull_request:
    paths:
      - 'Sources/**'
      - 'SampleApp/Sources/**'
      - 'Package.swift'
      - 'Tools/SDGMetadataExtractor/**'
      - 'mcp/**'
      - 'plugins/**'
      - '.claude-plugin/**'
      - '.cursor-plugin/**'
      - '.github/workflows/mcp-check.yml'
      - '.github/scripts/sdg-builder-mcp-artifact.py'
      - '.github/scripts/sdg-builder-validate.py'
  push:
    branches:
      - main
    paths:
      - 'Sources/**'
      - 'SampleApp/Sources/**'
      - 'Package.swift'
      - 'Tools/SDGMetadataExtractor/**'
      - 'mcp/**'
      - 'plugins/**'
      - '.claude-plugin/**'
      - '.cursor-plugin/**'
      - '.github/workflows/mcp-check.yml'
      - '.github/scripts/sdg-builder-mcp-artifact.py'
      - '.github/scripts/sdg-builder-validate.py'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.request_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  mcp:
    if: github.event_name != 'workflow_dispatch' || (github.repository == 'shopl/shopl-design-guide-ios' && github.ref == 'refs/heads/main')
    # 공개 레포라 포크 PR도 실행된다. self-hosted 러너 대신 GitHub 호스트 러너를 쓴다.
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # main의 검증기를 보관한 뒤 요청 SHA를 읽는다. 입력 문자열은 셸 코드에 삽입하지 않는다.
      - name: Verify Builder source
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_BASE: ${{ inputs.source_base }}
          BUILD_ID: ${{ inputs.request_id }}
        run: |
          cp .github/scripts/sdg-builder-validate.py "$RUNNER_TEMP/sdg-builder-validate.py"
          cp .github/scripts/sdg-builder-mcp-artifact.py "$RUNNER_TEMP/sdg-builder-mcp-artifact.py"
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          # PR merge 결과에도 같은 데이터가 되도록 앱 빌드 때의 main과 일치해야 한다.
          test "$SOURCE_BASE" = "$GITHUB_SHA"
          git check-ref-format "refs/heads/$SOURCE_BRANCH"
          git fetch --no-tags origin "refs/heads/$SOURCE_BRANCH"
          git checkout --detach "$SOURCE_SHA"
          git update-ref refs/remotes/origin/main "$GITHUB_SHA"
          python3 "$RUNNER_TEMP/sdg-builder-validate.py"

      # SDG 소스는 Swift 6.1 문법을 쓰고 추출기는 swift-syntax 604를 빌드하므로, 러너에 있는 가장 최신 정식 Xcode를 쓴다.
      - name: Select latest stable Xcode
        id: toolchain
        run: |
          latest="$(printf '%s\n' /Applications/Xcode_*.app | grep -viE 'beta|rc|release_candidate' | sort -V | tail -1)"
          if [ -d "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
          swift --version
          echo "swift=$(swift --version 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      # 툴체인이 바뀌면 이전 컴파일 결과(.build)를 쓰지 않도록 Swift 버전을 키에 넣는다.
      - name: Cache extractor build
        uses: actions/cache@v4
        with:
          path: Tools/SDGMetadataExtractor/.build
          key: sdg-extractor-${{ runner.os }}-${{ steps.toolchain.outputs.swift }}-${{ hashFiles('Tools/SDGMetadataExtractor/Package.resolved') }}

      - name: Extractor tests
        run: swift test --package-path Tools/SDGMetadataExtractor

      - name: Install MCP dependencies
        working-directory: mcp
        run: npm ci

      - name: Type check
        working-directory: mcp
        run: npm run typecheck

      - name: Regenerate metadata and bundle
        working-directory: mcp
        run: npm run build

      - name: Check committed plugin files are up to date
        if: github.event_name != 'workflow_dispatch'
        run: |
          if ! git diff --exit-code --stat -- plugins/sdg-ios/server; then
            echo "::error::plugins/sdg-ios/server가 현재 소스로 생성한 결과와 다릅니다. 'cd mcp && npm run build'를 실행하고 변경된 파일을 커밋하세요."
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard -- plugins/sdg-ios/server)"
          if [ -n "$untracked" ]; then
            echo "::error::커밋되지 않은 생성 파일이 있습니다: $untracked"
            exit 1
          fi

      - name: Smoke test
        working-directory: mcp
        run: npm run smoke

      - name: Validate marketplace and plugin manifests
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.296 plugin validate .
          npx --yes @anthropic-ai/claude-code@2.1.296 plugin validate ./plugins/sdg-ios

      # 플러그인 문서가 안내하는 최소 실행 환경(Node 18)에서도 번들이 동작하는지 확인한다.
      - name: Setup Node 18 (minimum supported runtime)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Smoke test on Node 18
        working-directory: mcp
        run: node scripts/smoke.mjs

      # 앱 코드는 변경하지 않고, 정확한 입력 SHA와 생성 파일 해시를 함께 전달한다.
      - name: Package Builder metadata
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_BASE: ${{ inputs.source_base }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: python3 "$RUNNER_TEMP/sdg-builder-mcp-artifact.py"

      - name: Upload Builder metadata
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: sdg-mcp-${{ inputs.request_id }}
          path: ${{ runner.temp }}/sdg-mcp-output/
          if-no-files-found: error
          retention-days: 7
